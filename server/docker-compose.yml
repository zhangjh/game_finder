# 开发/自托管编排：PostgreSQL + pgvector 与 Express API server
# 用法：docker compose up -d            （构建并启动 server + postgres）
#      docker compose up -d postgres    （仅起数据库，本地跑 server dev）
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: game_discovery_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_discovery
    ports:
      - "5432:5432"
    volumes:
      - game_discovery_pgdata:/var/lib/postgresql/data
      # 初始化脚本：首次建库时自动执行（按文件名字母序）
      - ./drizzle/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_discovery"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: game_discovery_server
    # 崩溃自动重启（进程内致命错误经 index.ts 兜底退出后，由本策略重启容器）
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/game_discovery
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  game_discovery_pgdata: